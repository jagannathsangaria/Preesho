name: Repair Android Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Regenerate Android platform
        run: flutter create --platforms=android .

      - name: Verify Firebase configuration
        run: |
          test -f android/app/google-services.json
          echo "Firebase config exists"

      - name: Check Android structure
        run: |
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          echo "Android structure is complete"

      - name: Commit generated Android files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git diff --cached --quiet || git commit -m "Regenerate complete Android platform"
          git push
