name: Repair Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Backup Firebase configuration
        run: |
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json /tmp/google-services.json
            echo "Firebase config backed up"
          else
            echo "ERROR: google-services.json not found"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Remove incomplete Android platform
        run: rm -rf android

      - name: Regenerate Android platform
        run: flutter create --platforms=android .

      - name: Restore Firebase configuration
        run: |
          cp /tmp/google-services.json android/app/google-services.json
          echo "Firebase config restored"

      - name: Verify Android structure
        run: |
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/build.gradle.kts
          test -f android/app/google-services.json
          echo "Android structure is complete"

      - name: Commit generated Android files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git diff --cached --quiet || git commit -m "Regenerate complete Android platform"
          git push
