name: Build Preesho APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Backup Flutter Files
        run: |
          set -e
          mkdir -p /tmp/preesho_backup
          cp -r lib /tmp/preesho_backup/lib
          cp pubspec.yaml /tmp/preesho_backup/pubspec.yaml

      - name: Create Fresh Android Project
        run: |
          set -e
          rm -rf android
          flutter create . --platforms=android

      - name: Configure Android
        run: |
          set -e

          # AndroidX
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          python3 - <<'PY'
          from pathlib import Path

          # ==========================================
          # settings.gradle.kts
          # ==========================================

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          # Kotlin 2.3.0
          text = text.replace(
              'id("org.jetbrains.kotlin.android") version "2.1.0" apply false',
              'id("org.jetbrains.kotlin.android") version "2.3.0" apply false'
          )

          # Firebase Google Services
          firebase_plugin = (
              'id("com.google.gms.google-services") '
              'version "4.4.2" apply false'
          )

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  "plugins {",
                  "plugins {\n    " + firebase_plugin,
                  1
              )

          # Flutter Maven repository
          flutter_repo = (
              'maven { '
              'url = uri("https://storage.googleapis.com/download.flutter.io") '
              '}'
          )

          if "storage.googleapis.com/download.flutter.io" not in text:
              text = text.replace(
                  "repositories {",
                  "repositories {\n        " + flutter_repo,
                  1
              )

          settings.write_text(text)

          # ==========================================
          # app/build.gradle.kts
          # ==========================================

          app = Path("android/app/build.gradle.kts")
          text = app.read_text()

          # Firebase plugin
          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services")',
                  1
              )

          # ------------------------------------------
          # REMOVE ALL OLD Kotlin jvmTarget SETTINGS
          # ------------------------------------------

          lines = text.splitlines()
          cleaned = []

          for line in lines:
              stripped = line.strip()

              if "jvmTarget =" in stripped:
                  continue

              if "jvmTarget.set(" in stripped:
                  continue

              if "JvmTarget.JVM_" in stripped:
                  continue

              cleaned.append(line)

          text = "\n".join(cleaned)

          # ------------------------------------------
          # Java 17
          # ------------------------------------------

          text = text.replace(
              "sourceCompatibility = JavaVersion.VERSION_11",
              "sourceCompatibility = JavaVersion.VERSION_17"
          )

          text = text.replace(
              "targetCompatibility = JavaVersion.VERSION_11",
              "targetCompatibility = JavaVersion.VERSION_17"
          )

          # ------------------------------------------
          # Remove existing kotlin { } blocks
          # ------------------------------------------

          while True:
              start = text.find("kotlin {")

              if start == -1:
                  break

              brace_start = text.find("{", start)

              if brace_start == -1:
                  break

              depth = 0
              end = None

              for i in range(brace_start, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1

                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  break

              text = text[:start] + text[end:]

          # ------------------------------------------
          # Add FINAL Kotlin configuration
          # ------------------------------------------

          text = text.rstrip()

          text += """

          kotlin {
              jvmToolchain(17)

              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }
          """

          app.write_text(text)

          # Show final configuration in Actions log
          print("===== FINAL android/app/build.gradle.kts =====")
          print(app.read_text())

          print("===== FINAL android/settings.gradle.kts =====")
          print(settings.read_text())

          print("===== FINAL android/gradle.properties =====")
          print(Path("android/gradle.properties").read_text())
          PY

      - name: Restore Flutter Files
        run: |
          set -e
          rm -rf lib
          cp -r /tmp/preesho_backup/lib .
          cp /tmp/preesho_backup/pubspec.yaml .

      - name: Restore Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret is empty"
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$GOOGLE_SERVICES_JSON" \
            > android/app/google-services.json

      - name: Verify Kotlin Configuration
        run: |
          set -e

          echo "Checking for old JVM target..."

          if grep -R "jvmTarget = JavaVersion.VERSION_11" android; then
            echo "ERROR: Old JVM target 11 still exists."
            exit 1
          fi

          if grep -R "jvmTarget = JavaVersion.VERSION_11.toString()" android; then
            echo "ERROR: Old Kotlin JVM target still exists."
            exit 1
          fi

          echo "Kotlin/Java configuration looks good."

      - name: Get Dependencies
        run: |
          set -e
          flutter pub get

      - name: Clean
        run: |
          set -e
          flutter clean

      - name: Build APK
        run: |
          set -e
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Preesho-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
