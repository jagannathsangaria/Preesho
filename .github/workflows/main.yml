name: Build Preesho APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Prepare Flutter Android project
        run: flutter create . --platforms=android

      - name: Add Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Configure Firebase and Kotlin
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")

          if settings.exists():
              s = settings.read_text()

              if 'id("org.jetbrains.kotlin.android") version "2.3.0"' not in s:
                  s = s.replace(
                      'id("org.jetbrains.kotlin.android") version "2.1.0"',
                      'id("org.jetbrains.kotlin.android") version "2.3.0"'
                  )

              if "com.google.gms.google-services" not in s:
                  s = s.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                      1
                  )

              settings.write_text(s)

          app = Path("android/app/build.gradle.kts")

          if app.exists():
              s = app.read_text()

              if "com.google.gms.google-services" not in s:
                  s = s.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services")',
                      1
                  )

              app.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Preesho-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
