name: Build Preesho APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create . --platforms=android

      - name: Add Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Configure Android
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")

          # Kotlin 2.3.0
          s = settings.read_text()
          s = re.sub(
              r'id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]+"',
              'id("org.jetbrains.kotlin.android") version "2.3.0"',
              s
          )
          settings.write_text(s)

          # App Gradle
          a = app.read_text()

          # Java 17
          a = a.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )

          # Remove old jvmTarget syntax
          a = re.sub(
              r'^\s*jvmTarget\s*=.*$',
              '',
              a,
              flags=re.MULTILINE
          )

          # Add new Kotlin compilerOptions syntax
          if "compilerOptions {" not in a:
              a += '''

import org.jetbrains.kotlin.gradle.dsl.JvmTarget

kotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_17)
    }
}
'''

          app.write_text(a)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Preesho-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
