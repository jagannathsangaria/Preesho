name: Build Preesho APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Backup Flutter App Files
        run: |
          set -e
          mkdir -p /tmp/preesho_backup
          cp -r lib /tmp/preesho_backup/lib
          cp pubspec.yaml /tmp/preesho_backup/pubspec.yaml

      - name: Remove Incomplete Android Project
        run: |
          set -e
          rm -rf android

      - name: Generate Fresh Android Project
        run: |
          set -e
          flutter create . --platforms=android

      - name: Configure Android Build
        run: |
          set -e

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          python3 - <<'PY'
          from pathlib import Path

          # Update Kotlin plugin to 2.3.0
          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          text = text.replace(
              'id("org.jetbrains.kotlin.android") version "2.1.0" apply false',
              'id("org.jetbrains.kotlin.android") version "2.3.0" apply false'
          )

          # Add Google Services plugin
          firebase_plugin = 'id("com.google.gms.google-services") version "4.4.2" apply false'

          if firebase_plugin not in text:
              text = text.replace(
                  "plugins {",
                  "plugins {\n    " + firebase_plugin,
                  1
              )

          settings.write_text(text)

          # Add Google Services plugin to app
          app = Path("android/app/build.gradle.kts")
          text = app.read_text()

          app_plugin = 'id("com.google.gms.google-services")'

          if app_plugin not in text:
              text = text.replace(
                  "plugins {",
                  "plugins {\n    " + app_plugin,
                  1
              )

          app.write_text(text)
          PY

      - name: Restore Flutter App Files
        run: |
          set -e
          rm -rf lib
          cp -r /tmp/preesho_backup/lib .
          cp /tmp/preesho_backup/pubspec.yaml .

      - name: Restore Firebase Configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Preesho-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
