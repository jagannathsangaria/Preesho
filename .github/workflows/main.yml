name: Build Preesho APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Backup Flutter App Files
        run: |
          set -e
          mkdir -p /tmp/preesho_backup
          cp -r lib /tmp/preesho_backup/lib
          cp pubspec.yaml /tmp/preesho_backup/pubspec.yaml

      - name: Remove Incomplete Android Project
        run: |
          set -e
          rm -rf android

      - name: Generate Fresh Android Project
        run: |
          set -e
          flutter create . --platforms=android

      - name: Configure Android Build
        run: |
          set -e

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          python3 - <<'PY'
          from pathlib import Path

          # ----------------------------------------
          # settings.gradle.kts
          # ----------------------------------------

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          # Kotlin 2.3.0
          text = text.replace(
              'id("org.jetbrains.kotlin.android") version "2.1.0" apply false',
              'id("org.jetbrains.kotlin.android") version "2.3.0" apply false'
          )

          # Google Services plugin
          firebase_plugin = (
              'id("com.google.gms.google-services") '
              'version "4.4.2" apply false'
          )

          if firebase_plugin not in text:
              text = text.replace(
                  "plugins {",
                  "plugins {\n    " + firebase_plugin,
                  1
              )

          settings.write_text(text)

          # ----------------------------------------
          # app/build.gradle.kts
          # ----------------------------------------

          app = Path("android/app/build.gradle.kts")
          text = app.read_text()

          # Google Services plugin
          app_plugin = 'id("com.google.gms.google-services")'

          if app_plugin not in text:
              text = text.replace(
                  "plugins {",
                  "plugins {\n    " + app_plugin,
                  1
              )

          # Remove old Kotlin jvmTarget syntax
          text = text.replace(
              'jvmTarget = JavaVersion.VERSION_11.toString()',
              ''
          )

          text = text.replace(
              'jvmTarget = JavaVersion.VERSION_17.toString()',
              ''
          )

          # Remove an existing kotlin compilerOptions block if present.
          # The generated Flutter project will then receive one clean block.
          start = text.find("kotlin {")

          if start != -1:
              brace_start = text.find("{", start)
              depth = 0
              end = None

              for i in range(brace_start, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end is not None:
                  text = text[:start] + text[end:]

          # Add modern Kotlin compilerOptions DSL
          text = text.rstrip() + '''

          kotlin {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }
          '''

          app.write_text(text)
          PY

          echo "===== settings.gradle.kts ====="
          cat android/settings.gradle.kts

          echo "===== app/build.gradle.kts ====="
          cat android/app/build.gradle.kts

          echo "===== gradle.properties ====="
          cat android/gradle.properties

      - name: Restore Flutter App Files
        run: |
          set -e
          rm -rf lib
          cp -r /tmp/preesho_backup/lib .
          cp /tmp/preesho_backup/pubspec.yaml .

      - name: Restore Firebase Configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret is empty."
            exit 1
          fi

          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Get Dependencies
        run: |
          set -e
          flutter pub get

      - name: Build APK
        run: |
          set -e
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Preesho-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
