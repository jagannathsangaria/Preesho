name: Build Preesho APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Backup Flutter App Files
        run: |
          set -e
          mkdir -p /tmp/preesho_backup
          cp -r lib /tmp/preesho_backup/lib
          cp pubspec.yaml /tmp/preesho_backup/pubspec.yaml

      - name: Remove Old Android Project
        run: |
          set -e
          rm -rf android

      - name: Create Fresh Android Project
        run: |
          set -e
          flutter create . --platforms=android

      - name: Configure AndroidX and Kotlin
        run: |
          set -e

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          python3 - <<'PY'
          from pathlib import Path

          # -----------------------------
          # settings.gradle.kts
          # -----------------------------

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          text = text.replace(
              'id("org.jetbrains.kotlin.android") version "2.1.0" apply false',
              'id("org.jetbrains.kotlin.android") version "2.3.0" apply false'
          )

          firebase_plugin = (
              'id("com.google.gms.google-services") '
              'version "4.4.2" apply false'
          )

          if firebase_plugin not in text:
              text = text.replace(
                  "plugins {",
                  "plugins {\n    " + firebase_plugin,
                  1
              )

          flutter_repo = (
              'maven { '
              'url = uri("https://storage.googleapis.com/download.flutter.io") '
              '}'
          )

          if flutter_repo not in text:
              text = text.replace(
                  "repositories {",
                  "repositories {\n        " + flutter_repo,
                  1
              )

          settings.write_text(text)

          # -----------------------------
          # app/build.gradle.kts
          # -----------------------------

          app = Path("android/app/build.gradle.kts")
          text = app.read_text()

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services")',
                  1
              )

          # Java 17
          text = text.replace(
              "sourceCompatibility = JavaVersion.VERSION_11",
              "sourceCompatibility = JavaVersion.VERSION_17"
          )

          text = text.replace(
              "targetCompatibility = JavaVersion.VERSION_11",
              "targetCompatibility = JavaVersion.VERSION_17"
          )

          # Remove old Kotlin block
          start = text.find("kotlin {")

          if start != -1:
              brace_start = text.find("{", start)
              depth = 0
              end = None

              for i in range(brace_start, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end is not None:
                  text = text[:start] + text[end:]

          # Add Kotlin 17 configuration
          text = text.rstrip() + '''

          kotlin {
              jvmToolchain(17)

              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }
          '''

          app.write_text(text)
          PY

      - name: Restore Flutter App Files
        run: |
          set -e
          rm -rf lib
          cp -r /tmp/preesho_backup/lib .
          cp /tmp/preesho_backup/pubspec.yaml .

      - name: Restore Firebase Configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret is empty"
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$GOOGLE_SERVICES_JSON" \
            > android/app/google-services.json

      - name: Get Dependencies
        run: |
          set -e
          flutter pub get

      - name: Clean Flutter Build
        run: |
          set -e
          flutter clean

      - name: Build APK
        run: |
          set -e
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Preesho-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
