name: Build Preesho APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Generate Android Project
        run: flutter create . --platforms=android

      - name: Configure Flutter Maven Repository
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/settings.gradle.kts")
          text = p.read_text()

          if 'maven { url = uri("https://storage.googleapis.com/download.flutter.io") }' not in text:
              text = text.replace(
                  "repositories {\n        google()",
                  'repositories {\n        maven { url = uri("https://storage.googleapis.com/download.flutter.io") }\n        google()'
              )

          p.write_text(text)
          PY

      - name: Restore Firebase Configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Configure Firebase
        run: |
          set -e

          if ! grep -q 'id("com.google.gms.google-services") version' android/settings.gradle.kts; then
            sed -i '/plugins {/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
          fi

          if ! grep -q 'id("com.google.gms.google-services")' android/app/build.gradle.kts; then
            sed -i '/plugins {/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Preesho-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
