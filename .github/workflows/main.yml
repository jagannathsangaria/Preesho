name: Build Preesho APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Clean Flutter and Gradle
        run: |
          flutter clean
          rm -rf android/.gradle
          rm -rf ~/.gradle/caches
          flutter pub get

      - name: Check Kotlin Configuration
        run: |
          echo "Checking Kotlin version in settings.gradle.kts:"
          grep -n "kotlin.android" android/settings.gradle.kts || true
          echo "Checking Gradle version:"
          grep "distributionUrl" android/gradle/wrapper/gradle-wrapper.properties || true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: preesho-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
