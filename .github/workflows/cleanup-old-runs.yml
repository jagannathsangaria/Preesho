name: Cleanup Old Workflow Runs

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete workflow runs older than #300
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const KEEP_FROM_RUN = 300;

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: owner,
                repo: repo,
                per_page: 100
              }
            );

            console.log(`Total workflow runs found: ${runs.length}`);

            let deleted = 0;

            for (const run of runs) {
              if (run.run_number < KEEP_FROM_RUN) {
                console.log(
                  `Deleting run #${run.run_number} - ${run.name}`
                );

                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner: owner,
                    repo: repo,
                    run_id: run.id
                  });

                  deleted++;
                } catch (error) {
                  console.log(
                    `Could not delete run #${run.run_number}: ${error.message}`
                  );
                }
              }
            }

            console.log(`Deleted workflow runs: ${deleted}`);
