name: Cleanup Old Workflow Runs

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete artifacts from old runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const KEEP_FROM_RUN = 300;

            console.log("Finding workflow runs...");

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner,
                repo,
                per_page: 100
              }
            );

            console.log(`Total runs found: ${runs.length}`);

            let deletedArtifacts = 0;
            let deletedRuns = 0;

            for (const run of runs) {
              if (run.run_number >= KEEP_FROM_RUN) {
                continue;
              }

              console.log(
                `Processing old run #${run.run_number} - ${run.name}`
              );

              // Find artifacts belonging to this workflow run
              try {
                const artifacts = await github.paginate(
                  github.rest.actions.listWorkflowRunArtifacts,
                  {
                    owner,
                    repo,
                    run_id: run.id,
                    per_page: 100
                  }
                );

                for (const artifact of artifacts) {
                  try {
                    console.log(
                      `Deleting artifact: ${artifact.name} (${artifact.id})`
                    );

                    await github.rest.actions.deleteArtifact({
                      owner,
                      repo,
                      artifact_id: artifact.id
                    });

                    deletedArtifacts++;
                  } catch (error) {
                    console.log(
                      `Could not delete artifact ${artifact.id}: ${error.message}`
                    );
                  }
                }
              } catch (error) {
                console.log(
                  `Could not list artifacts for run #${run.run_number}: ${error.message}`
                );
              }

              // Delete the old workflow run
              try {
                console.log(`Deleting workflow run #${run.run_number}`);

                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });

                deletedRuns++;
              } catch (error) {
                console.log(
                  `Could not delete run #${run.run_number}: ${error.message}`
                );
              }
            }

            console.log("================================");
            console.log(`Deleted artifacts: ${deletedArtifacts}`);
            console.log(`Deleted workflow runs: ${deletedRuns}`);
            console.log("Cleanup completed.");
            console.log("================================");
