name: preesho
description: Preesho shopping application.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  cloud_functions: ^5.6.0
  firebase_storage: ^12.4.10

  # Image selection
  image_picker: ^1.1.2

  # Persistent cart storage
  shared_preferences: ^2.5.3

  # Location for checkout address
  geolocator: ^13.0.2

  # Existing checkout / Excel / file functionality
  excel: ^4.0.6
  file_picker: ^8.3.7
  file_saver: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
