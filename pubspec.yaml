name: preesho
description: Preesho shopping app - mobile first V1
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0

  # Location
  geolocator: ^14.0.2

  # Excel Import / Export
  excel: ^4.0.6

  # File Picker
  file_picker: ^10.3.3

  # Download Excel File (Web)
  universal_html: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
